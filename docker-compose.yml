  rabbitmq:
    image: rabbitmq:3-management
    container_name: rbmq
    ports:
      - "5672:5672" # Standard AMQP port
      - "15672:15672" # Management UI port
    environment:
      # Default credentials (change for production)
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # Optional: define a specific virtual host
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      # Persist data to a named volume on the host
      - 'rabbitmq_data:/var/lib/rabbitmq/mnesia'
      # Optional: persist logs
      - 'rabbitmq_logs:/var/log/rabbitmq'

  ap-comm:
    container_name: APcomm
    restart: unless-stopped
    tty: true
    build: 
      context: APcomm
    volumes:
      - ./APcomm:/app
    # isolation: process
    # devices:
    #   # Use "class-forwardslash-{GUID}" format
    #   - "class/{86E0D1E0-8089-11D0-9CE4-08003E301F73}"
    devices:
      - /dev/ttyUSB0

    # environment:
      # ALLOWEDHOSTS: 'http://localhost:5173'
      # MYSQLHOST: databaseMYSQL
    # networks:
      # - databaseNetwork
      # - backendNetwork
    # depends_on:
    #   - backendMysqlDB
    # command: ["python3", "-m", "uvicorn", "main:app", "--host=0.0.0.0"]
    command: ["python3", "main.py"]

  ap-direct:
    container_name: APdirect
    restart: unless-stopped
    tty: true
    build: 
      context: APdirect
    volumes:
      - ./APdirect:/app
    # isolation: process
    # devices:
    #   # Use "class-forwardslash-{GUID}" format
    #   - "class/{86E0D1E0-8089-11D0-9CE4-08003E301F73}"
    devices:
      - /dev/ttyUSB0
    command: ["python3", "main.py"]

